# docker-compose.test.yml - Test environment
# Used for running integration tests with real services

services:
  # PostgreSQL for tests
  postgres-test:
    image: postgres:16-alpine
    container_name: pluribus-postgres-test
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
      - POSTGRES_DB=pluribus_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d pluribus_test"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  # Redis for tests
  redis-test:
    image: redis:7-alpine
    container_name: pluribus-redis-test
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data
