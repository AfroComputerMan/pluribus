# docker-compose.yml - Development Stack
services:
  # ===================
  # Main Application
  # ===================
  pluribus:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: pluribus-dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://pluribus:pluribus@postgres:5432/pluribus
      - REDIS_URL=redis://redis:6379
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-dev-master-key-change-in-production}
      - LOG_LEVEL=debug
    volumes:
      - ./src:/app/src:ro
      - ./drizzle:/app/drizzle:ro
      - ./.env:/app/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pluribus-network
    restart: unless-stopped

  # ===================
  # PostgreSQL Database
  # ===================
  postgres:
    image: postgres:16-alpine
    container_name: pluribus-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=pluribus
      - POSTGRES_PASSWORD=pluribus
      - POSTGRES_DB=pluribus
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pluribus -d pluribus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pluribus-network
    restart: unless-stopped

  # ===================
  # Redis (Queue + Cache)
  # ===================
  redis:
    image: redis:7-alpine
    container_name: pluribus-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pluribus-network
    restart: unless-stopped

  # ===================
  # Redis Commander (Dev UI)
  # ===================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: pluribus-redis-ui
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis
    networks:
      - pluribus-network
    profiles:
      - dev-tools

  # ===================
  # pgAdmin (Dev UI)
  # ===================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pluribus-pgadmin
    ports:
      - "8082:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@pluribus.local
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - pluribus-network
    profiles:
      - dev-tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  pluribus-network:
    driver: bridge
